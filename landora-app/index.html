<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Landora · Painel</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- Ícone do atalho na tela inicial do celular -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-title" content="Landora" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Intro em vídeo ao abrir o app (fica por cima enquanto o app carrega por baixo). */
      #intro { position: fixed; inset: 0; z-index: 9999; background: #0b0d12; display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; }
      #intro.hide { opacity: 0; pointer-events: none; }
      #intro video { width: 100%; height: 100%; object-fit: contain; background: #0b0d12; }
      #intro-skip { position: absolute; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 999px; padding: 8px 16px; font: 600 13px system-ui, sans-serif; cursor: pointer; opacity: 0; transition: opacity .3s; }
      #intro.can-skip #intro-skip { opacity: 1; }
      #intro-sound { position: absolute; left: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: none; background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 999px; padding: 8px 14px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
      #intro.muted #intro-sound { display: block; }
    </style>
  </head>
  <body>
    <!-- Intro: troque o vídeo substituindo public/intro.mp4. Sem o arquivo, o app abre direto. -->
    <div id="intro" aria-hidden="true">
      <video id="intro-video" src="/intro.mp4" poster="/intro-poster.jpg" playsinline webkit-playsinline preload="auto"></video>
      <button id="intro-sound" type="button">🔊 Ativar som</button>
      <button id="intro-skip" type="button">Pular</button>
    </div>
    <script>
      // Toca a intro toda vez que o app abre ou a página é atualizada.
      (function () {
        var intro = document.getElementById("intro");
        var video = document.getElementById("intro-video");
        var done = false;
        var finish = function () {
          if (done) return;
          done = true;
          intro.classList.add("hide");
          try { video.pause(); } catch (e) {}
          setTimeout(function () { intro.remove(); }, 500);
        };
        video.addEventListener("ended", finish);
        video.addEventListener("error", finish); // sem vídeo (ou formato não suportado): abre o app direto
        document.getElementById("intro-skip").addEventListener("click", finish);
        setTimeout(function () { intro.classList.add("can-skip"); }, 1200);
        // Se o vídeo não começar em 6 s (internet lenta), não segura o app.
        setTimeout(function () { if (video.currentTime === 0) finish(); }, 6000);
        // Trava de segurança: nunca mais de 20 s.
        setTimeout(finish, 20000);
        // Tenta tocar com som (volume já reduzido no arquivo). Se o navegador bloquear som
        // automático, toca sem som e mostra o botão "Ativar som".
        video.volume = 0.8;
        var playMuted = function () {
          video.muted = true;
          intro.classList.add("muted");
          var q = video.play();
          if (q && q.catch) q.catch(function () { finish(); });
        };
        try {
          var p = video.play();
          if (p && p.catch) p.catch(playMuted);
        } catch (e) { playMuted(); }
        document.getElementById("intro-sound").addEventListener("click", function () {
          video.muted = false;
          intro.classList.remove("muted");
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
