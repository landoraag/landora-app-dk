# Radar de Prospecção: confere de hora em hora se alguma cidade está na agenda (dia/hora em
# radar_config/geral, horário de Brasília) ou se há pedidos na fila. Sem trabalho, termina em segundos.
# Só baixa a base da Receita (30-60 min) quando a Receita publicou arquivos novos ou entrou cidade nova.
name: Radar · atualizar prospecções

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Forçar atualização completa (baixa a Receita de novo)"
        type: boolean
        default: false

concurrency:
  group: radar-atualizar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: radar-prospeccao/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radar-prospeccao/pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Rodar o pipeline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RADAR_WORK: ${{ runner.temp }}/radar_work
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT (veja radar-prospeccao/README.md)"; exit 1; fi
          python3 run.py ${{ inputs.forcar && '--forcar' || '' }}
      - name: Publicar a lista para a verificação online (branch radar-verificacoes)
        env:
          RADAR_WORK: ${{ runner.temp }}/radar_work
        run: |
          [ -f "$RADAR_WORK/verify_todo.json" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git fetch origin radar-verificacoes || true
          if git rev-parse --verify -q origin/radar-verificacoes >/dev/null; then git checkout -B radar-verificacoes origin/radar-verificacoes; else git checkout -B radar-verificacoes "origin/${{ github.event.repository.default_branch }}"; fi
          mkdir -p verificacoes && cp "$RADAR_WORK/verify_todo.json" pendentes.json
          git add pendentes.json && (git diff --cached --quiet || (git commit -qm "Lista de verificação online $(date -u +%F)" && git push -q origin radar-verificacoes))
