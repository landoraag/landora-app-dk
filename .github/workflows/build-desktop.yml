name: Gerar app do Windows (.exe)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Gerar o instalador
        run: npm run dist
      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: Landora-Setup
          path: desktop/dist/Landora-Setup.exe
